name: Flutter CI/CD

on:
  push:
    branches:
      - main
      - development
      - 'development/**'
      - feature/supabase-pid-testing
  pull_request:
    branches:
      - main
      - development
      - 'development/**'

permissions:
  contents: read

jobs:
  recording_database:
    name: Recording schema and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: recording_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrations, ownership policies, and duplicate-safe uploads
        env:
          PGPASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          psql -h localhost -U postgres -d recording_test -v ON_ERROR_STOP=1
          -f supabase/tests/auth_fixture.sql
          -f supabase/migrations/20261003000000_owner_vehicle_ingestion.sql
          -f supabase/migrations/20261004000000_obd_recording_sync.sql
          -f supabase/tests/recording_rls.sql
  flutter:
    name: Flutter checks and Android release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
