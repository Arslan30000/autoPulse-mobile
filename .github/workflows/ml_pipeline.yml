name: Vehicle baseline pipeline

on:
  push:
    branches:
      - main
      - feature/vehicle-anomaly-pipeline
    paths:
      - 'ml/**'
      - 'supabase/migrations/20261115000000_ml_pipeline.sql'
      - '.github/workflows/ml_pipeline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ml/**'
      - 'supabase/migrations/20261115000000_ml_pipeline.sql'
      - '.github/workflows/ml_pipeline.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run model and recording integrity tests
        run: python -m unittest discover -s ml/tests -v

  process_completed_runs:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/vehicle-anomaly-pipeline')
    needs: model_tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vehicle-baseline-worker
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check worker credentials
        if: github.event_name != 'push'
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Score queued recordings
        if: github.event_name != 'push' || (env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '')
        run: python -m ml.pipeline worker --max-jobs 100
