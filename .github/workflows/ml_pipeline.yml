name: Vehicle baseline pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'ml/**'
      - 'supabase/migrations/20261115000000_ml_pipeline.sql'
      - 'supabase/migrations/20261115090000_ml_worker_invoker.sql'
      - 'supabase/migrations/20261115091000_ml_worker_grants.sql'
      - '.github/workflows/ml_pipeline.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ml/**'
      - 'supabase/migrations/20261115000000_ml_pipeline.sql'
      - 'supabase/migrations/20261115090000_ml_worker_invoker.sql'
      - 'supabase/migrations/20261115091000_ml_worker_grants.sql'
      - '.github/workflows/ml_pipeline.yml'

permissions:
  contents: read

jobs:
  model_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run model and recording integrity tests
        run: python -m unittest discover -s ml/tests -v

  context_training_tests:
    name: Offline context training and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/driving_context/requirements.txt
      - name: Install pinned training dependencies
        run: python -m pip install -r ml/driving_context/requirements.txt
      - name: Verify synthetic fitting, export and causal feature parity
        run: python -m unittest discover -s ml/tests -v
