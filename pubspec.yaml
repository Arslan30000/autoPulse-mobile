name: autopulse_ai
description: "AI-assisted vehicle health monitoring and diagnostic application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.2.0+3
  provider: ^6.1.2
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.3
  model_viewer_plus: ^1.7.0
  supabase_flutter: ^2.18.0
  sqflite: ^2.4.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/models/car/
    - assets/
